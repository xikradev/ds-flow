<header class="flex min-h-20 items-center justify-between border-b border-line bg-deep px-4 sm:px-8">
  <a
    class="font-display text-xl font-semibold tracking-[-0.05em] text-ink no-underline"
    [href]="homeHref()"
    [attr.aria-label]="brandLabel()"
  >
    DSflow
  </a>
  <button
    type="button"
    class="inline-flex min-h-11 cursor-pointer items-center gap-2 rounded-xl border border-line bg-panel-raised px-4 text-sm font-semibold text-ink transition duration-200 hover:border-line-bright focus-visible:outline-flow"
    [attr.aria-label]="themeService.theme() === 'light' ? 'Ativar tema escuro' : 'Ativar tema claro'"
    (click)="themeService.toggle()"
  >
    <span class="material-icons !text-xl" aria-hidden="true">{{ themeService.theme() === 'light' ? 'dark_mode' : 'light_mode' }}</span>
    <span>{{ themeService.theme() === 'light' ? 'Escuro' : 'Claro' }}</span>
  </button>
</header>
