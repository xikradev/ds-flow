<main
  class="grid min-h-dvh grid-rows-[auto_1fr_auto] overflow-hidden bg-void text-ink"
>
  <app-header />

  <div class="min-h-0">
    <router-outlet />
  </div>

  <app-simulation-controls
    [playback]="simulation.playback()"
    [canStart]="simulation.canStart()"
    [canGoBack]="simulation.canGoBack()"
    [canGoForward]="simulation.canGoForward()"
    (previousStep)="simulation.previous()"
    (togglePlayback)="togglePlayback()"
    (nextStep)="simulation.next()"
  />
</main>
