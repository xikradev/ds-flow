<section
  id="simulator"
  class="flex h-full min-h-0 items-center justify-center overflow-auto bg-[linear-gradient(rgb(34_71_101_/_0.16)_1px,transparent_1px),linear-gradient(90deg,rgb(34_71_101_/_0.16)_1px,transparent_1px)] bg-center p-6 [background-size:44px_44px] sm:p-10"
  aria-label="Área de visualização do bubble sort"
>
  <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-4" aria-label="Lista de valores">
    @for (value of values(); track $index) {
      <div
        class="flex size-16 shrink-0 items-center justify-center rounded-xl border border-line-bright bg-panel-raised font-mono text-xl font-semibold text-ink shadow-panel transition-transform duration-200 sm:size-20 sm:text-2xl"
        [attr.aria-label]="'Valor ' + value"
      >
        {{ value }}
      </div>
    }

    <app-value-adder (valueAdded)="addValue($event)" />
  </div>
</section>
