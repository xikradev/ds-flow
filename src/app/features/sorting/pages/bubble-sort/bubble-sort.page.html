<section
  id="simulator"
  class="flex h-full min-h-0 items-center justify-center overflow-auto bg-[linear-gradient(rgb(84_137_180_/_0.12)_1px,transparent_1px),linear-gradient(90deg,rgb(84_137_180_/_0.12)_1px,transparent_1px)] bg-center p-6 [background-size:44px_44px] sm:p-10"
  aria-label="Área de visualização do bubble sort"
>
  <div appSwapAnimation class="flex flex-wrap items-center justify-center gap-3 sm:gap-4" aria-label="Lista de valores">
    @let step = simulation.currentStep();
    @for (item of sortingList.items(); track item.id; let index = $index) {
      <app-sorting-value
        [attr.data-sorting-id]="item.id"
        [value]="item.value"
        [isNew]="item.id === newestValueId()"
        [disabled]="simulation.editingDisabled()"
        [comparing]="step?.comparing ? step.comparing!.includes(index) : false"
        [sorted]="step ? step.sortedPositions.includes(index) : false"
        (deleteRequested)="removeValue(index)"
        (valueEdited)="editValue(index, $event)"
      />
    }

    @if (!simulation.editingDisabled()) {
      <app-value-adder (valueAdded)="addValue($event)" />
    }
  </div>
  <p class="sr-only" aria-live="polite" aria-atomic="true">{{ simulationDescription() }}</p>
</section>
