<section
  id="simulator"
  class="flex h-full min-h-0 items-center justify-center overflow-auto bg-[linear-gradient(rgb(84_137_180_/_0.12)_1px,transparent_1px),linear-gradient(90deg,rgb(84_137_180_/_0.12)_1px,transparent_1px)] bg-center p-6 [background-size:44px_44px] sm:p-10"
  aria-label="Área de visualização do bubble sort"
>
  <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-4" aria-label="Lista de valores">
    @for (item of sortingList.items(); track item.id; let index = $index) {
      <app-sorting-value
        [value]="item.value"
        [isNew]="item.id === newestValueId()"
        [disabled]="simulation.editingDisabled()"
        (deleteRequested)="removeValue(index)"
        (valueEdited)="editValue(index, $event)"
      />
    }

    <app-value-adder [disabled]="simulation.editingDisabled()" (valueAdded)="addValue($event)" />
  </div>
</section>
