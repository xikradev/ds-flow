<section
  id="simulator"
  class="flex h-full min-h-0 items-center justify-center overflow-auto bg-[linear-gradient(rgb(34_71_101_/_0.16)_1px,transparent_1px),linear-gradient(90deg,rgb(34_71_101_/_0.16)_1px,transparent_1px)] bg-center p-6 [background-size:44px_44px] sm:p-10"
  aria-label="Área de visualização do bubble sort"
>
  <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-4" aria-label="Lista de valores">
    @for (value of values(); track $index) {
      <div
        class="flex size-16 shrink-0 items-center justify-center rounded-xl border border-line-bright bg-panel-raised font-mono text-xl font-semibold text-ink shadow-panel transition-transform duration-200 sm:size-20 sm:text-2xl"
        [attr.aria-label]="'Valor ' + value"
      >
        {{ value }}
      </div>
    }

    @if (isAddingValue()) {
      <input
        #valueInput
        class="size-16 shrink-0 rounded-xl border border-line-bright bg-deep px-1 text-center font-mono text-xl font-semibold text-ink outline-none transition duration-200 placeholder:text-ink-muted [appearance:textfield] focus:bg-deep focus:border-signal/60 focus:shadow-[0_0_12px_rgb(66_165_255_/_0.20)] focus-visible:!outline-none [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none sm:size-20 sm:text-2xl"
        type="number"
        min="1"
        max="99"
        step="1"
        inputmode="numeric"
        placeholder="1–99"
        aria-label="Novo valor entre 1 e 99. Use as setas para cima e para baixo para ajustar."
        [value]="newValue()"
        (input)="updateNewValue(valueInput.value)"
        (blur)="cancelAdding()"
        (keyup.enter)="addValue()"
      />
    } @else {
      <button
        type="button"
        class="flex size-16 shrink-0 cursor-pointer items-center justify-center rounded-xl border border-line-bright bg-deep text-ink-muted transition duration-200 hover:border-signal hover:bg-panel hover:text-signal focus-visible:border-flow sm:size-20"
        aria-label="Adicionar valor à lista"
        (click)="startAdding()"
      >
        <mat-icon class="!size-auto !text-3xl sm:!text-4xl" aria-hidden="true">add</mat-icon>
      </button>
    }
  </div>
</section>
